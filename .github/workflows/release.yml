name: Release

# Cria uma tag de versão (ex.: git tag v0.1.0 && git push --tags) e este workflow
# gera o instalador do Windows e abre um rascunho de release com ele anexado.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: A tag bate com a versão do package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, mas o package.json está em $version"; exit 1
          fi
      - run: npm run check
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
